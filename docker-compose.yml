services:
  app:
    image: charmflex/server-flexiexpensesmanager:latest
    ports:
      - "3010:3000"
    environment:
      - CONFIG_ANNOUNCEMENT_FILE_PATH=/app/config/scene_announcements.json
      - CONFIG_ADS_FILE_PATH=/app/config/ads_config.json
      - SECRET_FILE_PATH=/app/secrets/prod_private.pem
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USERNAME=${SUPABASE_DB_USERNAME}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - DB_URL=${SUPABASE_DB_URL}
      - DB_USERNAME=${SUPABASE_DB_USERNAME}
      - DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/secrets/firebase-service-account.json
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    restart: unless-stopped

    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
