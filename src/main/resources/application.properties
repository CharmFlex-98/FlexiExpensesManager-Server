spring.config.import=optional:.env.properties
server.port=3000
spring.application.name=flexiexpensesmanager
signature.private-key=${SECRET_FILE_PATH}
remote-config.scene-announcement.path=${CONFIG_ANNOUNCEMENT_FILE_PATH}
remote-config.ads-config.path=${CONFIG_ADS_FILE_PATH}
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
