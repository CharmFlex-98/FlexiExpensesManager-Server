spring.config.import=optional:.env.properties
server.port=3000
spring.application.name=flexiexpensesmanager
signature.private-key=secrets/debug_private.pem
remote-config.scene-announcement.path=config/scene_announcements.json
remote-config.ads-config.path=config/ads_config.json
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8
spring.datasource.url=jdbc:h2:mem:flexiexpensesmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
firebase.service-account-json=
firebase.service-account-path=
